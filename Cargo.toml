[package]
name = "parakeet-cli"
version = "0.1.6"
edition = "2024"
description = "Local speech-to-text CLI powered by NVIDIA Parakeet TDT via ONNX Runtime"
license = "Apache-2.0"
repository = "https://github.com/lucataco/parakeet-cli"
homepage = "https://github.com/lucataco/parakeet-cli"
readme = "README.md"
rust-version = "1.85"
keywords = ["cli", "speech-to-text", "transcription", "audio", "onnx"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "parakeet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

ort = { version = "2.0.0-rc.12", features = ["coreml"] }
ndarray = "0.16"

tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.12", features = ["stream"] }

indicatif = "0.17"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"

sha2 = "0.10"

dirs = "6"

futures-util = "0.3"

hound = "3.5"

realfft = "3"

cpal = "0.15"

crossbeam-channel = "0.5"

ctrlc = "3.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mel_spectrogram"
harness = false

[[bench]]
name = "resampling"
harness = false

[[bench]]
name = "encoder"
harness = false

[[bench]]
name = "decoder"
harness = false

[[bench]]
name = "vad"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "memory"
harness = false
